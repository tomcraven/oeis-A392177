<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>A392177</title>
        <style>
            :root {
                color-scheme: dark;
                --aspect: 16 / 9;
            }
            html,
            body {
                margin: 0;
                padding: 0;
                width: 100%;
                height: 100%;
                background: #050508;
                color: #e0e0e0;
                font-family:
                    ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
                    monospace;
                overflow: hidden;
            }
            body {
                display: grid;
                place-items: center;
            }
            body > canvas {
                display: block;
                outline: none;
                background: #000;
                aspect-ratio: var(--aspect);
                width: auto;
                height: auto;
                max-width: 100vw;
                max-height: 100vh;
            }
            #loading,
            #error {
                position: fixed;
                inset: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                text-align: center;
                padding: 2rem;
                gap: 0.75rem;
                background: #050508;
                z-index: 10;
            }
            #error {
                display: none;
                color: #ff6b6b;
            }
            #error.visible {
                display: flex;
            }
            .spinner {
                width: 32px;
                height: 32px;
                border: 3px solid #333;
                border-top-color: #e0e0e0;
                border-radius: 50%;
                animation: spin 0.8s linear infinite;
            }
            @keyframes spin {
                to {
                    transform: rotate(360deg);
                }
            }
            .hidden {
                display: none !important;
            }
        </style>
    </head>
    <body>
        <div id="loading">
            <div class="spinner"></div>
            <div>Loading A392177…</div>
        </div>

        <div id="error">
            <h2>Failed to load</h2>
            <p id="error-message"></p>
            <p>
                This build uses <strong>WebGPU</strong>. You need a recent
                Chromium-based browser (Chrome/Edge 113+), Safari 18+, or
                Firefox Nightly with WebGPU enabled.
            </p>
        </div>

        <script type="module">
            import init from "./red_black_knights.js";

            const loading = document.getElementById("loading");
            const errorEl = document.getElementById("error");
            const errorMsg = document.getElementById("error-message");

            function showError(msg) {
                loading.classList.add("hidden");
                errorMsg.textContent = msg;
                errorEl.classList.add("visible");
                console.error(msg);
            }

            async function run() {
                if (!("gpu" in navigator)) {
                    showError(
                        "navigator.gpu is not available — your browser does not support WebGPU.",
                    );
                    return;
                }

                try {
                    await init();
                    loading.classList.add("hidden");
                } catch (e) {
                    showError(e?.message ?? String(e));
                }
            }

            run();
        </script>
    </body>
</html>
