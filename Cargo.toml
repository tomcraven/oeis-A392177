[package]
name = "red_black_knights"
version = "0.1.0"
edition = "2024"

[lib]
name = "red_black_knights"
path = "src/lib.rs"

[[bin]]
name = "red_black_knights"
path = "src/main.rs"

[[bin]]
name = "time_sim"
path = "src/bin/time_sim.rs"

[[bin]]
name = "discover_batch"
path = "src/bin/discover_batch.rs"

[[bin]]
name = "discover_rerender"
path = "src/bin/discover_rerender.rs"

[[bin]]
name = "discover_reference"
path = "src/bin/discover_reference.rs"

[dependencies]
bevy = { version = "0.18.1", default-features = false, features = [
    "bevy_asset",
    "bevy_log",
    "bevy_window",
    "bevy_winit",
    "bevy_render",
    "bevy_core_pipeline",
    "multi_threaded",
    "sysinfo_plugin",
    "tonemapping_luts",

    "bevy_sprite",
    "bevy_sprite_render",
    "bevy_text",
    "bevy_ui",
    "bevy_ui_render",
    "default_font",

    "png",
    "zstd_rust",
    "webgpu",
    "debug",
] }

log = { version = "0.4", features = ["max_level_debug", "release_max_level_warn"] }
rand = "0.9"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
image = { version = "0.25", default-features = false, features = ["png"] }

bevy_egui = { version = "0.39", default-features = false, features = [
    "default_fonts",
    "render",
] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
dirs = "6"
bevy_egui = { version = "0.39", default-features = false, features = [
    "default_fonts",
    "manage_clipboard",
    "open_url",
    "render",
] }

[target.'cfg(target_os = "linux")'.dependencies]
bevy = { version = "0.18.1", default-features = false, features = ["x11", "wayland"] }

[target.'cfg(target_family = "wasm")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "Storage"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1

[profile.wasm-release]
inherits = "release"
opt-level = "s"
strip = "debuginfo"

[profile.wasm-release-fast]
inherits = "release"
opt-level = 3
strip = "debuginfo"

[features]
place_profile = []

[[bin]]
name = "profile_place"
path = "src/bin/profile_place.rs"
required-features = ["place_profile"]
